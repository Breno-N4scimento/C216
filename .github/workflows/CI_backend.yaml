name: CI_Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "poetry"
          cache-dependency-path: backend/poetry.lock

      - name: Install Dependencies
        run: poetry install --no-root

      - name: Check Project
        run: poetry check


  tests:
    name: Pytest
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "poetry"
          cache-dependency-path: backend/poetry.lock

      - name: Install Dependencies
        run: poetry install --no-root

      - name: Run Tests
        run: poetry run pytest

