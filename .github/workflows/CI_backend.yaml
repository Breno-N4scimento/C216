
name: CI - Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Install Poetry
        run: pipx install poetry

      - name: Install Dependencies
        run: poetry install --no-root

      - name: Check Project
        run: poetry check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Install Poetry
        run: pipx install poetry

      - name: Install Dependencies
        run: poetry install --no-root

      - name: Run Unit Tests
        run: poetry run pytest tests/unit -v

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backend_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backend_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/backend_db
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/backend_test_db

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Install Poetry
        run: pipx install poetry

      - name: Install Dependencies
        run: poetry install --no-root

      - name: Create Test Database
        run: |
          poetry run python -c "
          import psycopg

          conn = psycopg.connect(
              'postgresql://postgres:postgres@localhost:5432/postgres',
              autocommit=True
          )

          exists = conn.execute(
              'SELECT 1 FROM pg_database WHERE datname = %s',
              ('backend_test_db',)
          ).fetchone()

          if not exists:
              conn.execute('CREATE DATABASE backend_test_db')
              print('Banco de testes criado.')
          else:
              print('Banco de testes já existe.')

          conn.close()
          "

      - name: Run Integration Tests
        run: poetry run pytest tests/integration -v
